name: Deploy prototype only to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage explicit prototype allowlist
        run: |
          mkdir -p /tmp/lentera-prototype
          cp index.html styles.css data.js pages-participant.js pages-admin.js app.js /tmp/lentera-prototype/
          cp -R assets /tmp/lentera-prototype/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/lentera-prototype
      - id: deployment
        uses: actions/deploy-pages@v4
